        function syncFieldToCloud(field, value) {
            if (!firebaseReady || applyingRemoteData) return;
            if (!auth.currentUser) {
                showNotification('Συνδέσου ως διαχειριστής για να αποθηκεύσεις αλλαγές.', 'error');
                return;
            }
            MENU_DOC.set({ [field]: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
                .catch(err => { console.error('Firestore save error:', err); showNotification('Αποτυχία αποθήκευσης στο Firebase: ' + err.message, 'error'); });
        }

        function startCloudSync() {
            MENU_DOC.onSnapshot(snapshot => {
                if (snapshot.exists) {
                    const data = snapshot.data();
                    applyingRemoteData = true;
                    if (data.categories) localStorage.setItem(STORAGE_KEY_CATEGORIES, JSON.stringify(data.categories));
                    if (data.products) localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(data.products));
                    if (data.config) localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(data.config));
                    if (data.tables) localStorage.setItem(STORAGE_KEY_TABLES, JSON.stringify(data.tables));
                    if (data.lang) localStorage.setItem(STORAGE_KEY_LANG, data.lang);
                    applyingRemoteData = false;
                    firebaseReady = true;
                    renderApp();
                } else {
                    firebaseReady = true;
                }
            }, err => { console.error('Firestore listener error:', err); showNotification('Σφάλμα σύνδεσης Firestore: ' + err.message, 'error'); });
        }

        function promptAdminLogin() {
            if (auth.currentUser) { startCloudSync(); return; }
            const email = prompt('Email διαχειριστή Firebase:');
            if (!email) { showNotification('Δεν έγινε σύνδεση διαχειριστή. Οι αλλαγές δεν θα συγχρονίζονται.', 'error'); startCloudSync(); return; }
            const password = prompt('Κωδικός διαχειριστή Firebase:');
            if (!password) { showNotification('Δεν έγινε σύνδεση διαχειριστή. Οι αλλαγές δεν θα συγχρονίζονται.', 'error'); startCloudSync(); return; }
            auth.signInWithEmailAndPassword(email.trim(), password).then(startCloudSync).catch(err => {
                console.error(err); alert('Αποτυχία σύνδεσης Firebase: ' + err.message); startCloudSync();
            });
        }

        function handleImageUpload(fileInput, callback) {
            const file = fileInput.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                showNotification('Η εικόνα είναι πολύ μεγάλη. Παρακαλώ επιλέξτε αρχείο κάτω των 2MB.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                callback(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('modal-container');
            const notif = document.createElement('div');
            notif.className = `fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white fade-in text-sm font-medium ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800'
            }`;
            notif.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            container.appendChild(notif);
            lucide.createIcons();
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transition = 'opacity 0.3s ease';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        function showConfirmModal(title, message, onConfirm) {
            const container = document.getElementById('modal-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 fade-in';

                    <div class="flex items-center gap-3 mb-3 text-rose-600">

                    </div>
                    <p class="text-slate-600 text-sm mb-6 leading-relaxed">${message}</p>

                        <button id="modal-cancel" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-medium text-sm transition-all">${t('cancel')}</button>
                        <button id="modal-ok" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm shadow-lg shadow-rose-600/20 transition-all">${t('confirm')}</button>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
            lucide.createIcons();

            wrapper.querySelector('#modal-cancel').onclick = () => wrapper.remove();
            wrapper.querySelector('#modal-ok').onclick = () => {
                wrapper.remove();
                onConfirm();
            };
        }

        function handleSaveTable(e, tableId) {
            e.preventDefault();
            const name = document.getElementById('table-custom-name').value.trim();

            let tables = getTables();
            if (tableId) {
                tables = tables.map(t => t.id === tableId ? { ...t, name } : t);
                showNotification('Το τραπέζι ενημερώθηκε!');
            } else {
                const newId = 't-' + Date.now();
                tables.push({ id: newId, name });
                showNotification('Το τραπέζι προστέθηκε!');
            }
            saveTables(tables);
            document.querySelector('.fixed.inset-0').remove();
            renderDesktopAdminContent();
        }

        function deleteTable(tableId) {
            showConfirmModal(t('confirmDelete'), t('confirmDeleteMsg'), () => {
                let tables = getTables().filter(t => t.id !== tableId);
                saveTables(tables);
                showNotification('Διαγράφηκε.', 'info');
                renderDesktopAdminContent();
            });
        }

        function downloadQr(tableId, tableName) {
            const el = document.getElementById(`qrcode-desktop-${tableId}`);
            const img = el.querySelector('img');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `QR_${tableName.replace(/\s+/g, '_')}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification(`Το QR Code για "${tableName}" αποθηκεύτηκε!`);
            }
        }

        function openProductAddToCartModal(productId, tableId) {
            const products = getProducts();

            const product = products.find(p => p.id === productId);
            if (!product) return;

            const lang = getCurrentLang();
            const prodName = lang === 'en' ? (product.nameEn || product.name) : product.name;
            const prodDesc = lang === 'en' ? (product.descriptionEn || product.description) : product.description;

            const container = document.getElementById('modal-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4 fade-in';
            
            wrapper.innerHTML = `
                <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-w-md w-full p-6 text-slate-800 border border-slate-100 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-slate-900">${prodName}</h3>
                        <button onclick="this.closest('.fixed').remove()" class="p-2 rounded-xl text-slate-400 hover:bg-slate-100 transition-all">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <img src="${product.image || 'https://placehold.co/400x200'}" class="w-full h-40 rounded-2xl object-cover mb-4 border border-slate-100" onerror="this.src='https://placehold.co/400x200/e2e8f0/64748b?text=Img'">
                    <p class="text-xs text-slate-500 mb-4">${prodDesc || ''}</p>

                    ${(product.options && product.options.length > 0) ? `
                        <div class="mb-5">
                            <label class="block text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">${t('selectOptions')}</label>
                            <div class="space-y-2">
                                ${product.options.map((opt, idx) => {
                                    const optName = lang === 'en' ? (opt.nameEn || opt.name) : opt.name;
                                    return `
                                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-amber-50/50 hover:border-amber-200 transition-all">
                                            <div class="flex items-center gap-3">
                                                <input type="checkbox" onchange="toggleOptionSelection(${idx})" class="w-4 h-4 rounded text-amber-500 focus:ring-amber-500 border-slate-300">
                                                <span class="text-xs font-bold text-slate-800">${optName}</span>
                                            </div>
                                            <span class="text-xs font-extrabold text-amber-600">+${Number(opt.price).toFixed(2)} ${config.currency}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="pt-2 flex items-center justify-between border-t border-slate-100">
                        <div>
                            <span class="block text-[10px] text-slate-400 uppercase font-bold">${t('total')}</span>
                            <span id="modal-calculated-price" class="text-xl font-extrabold text-amber-600">${Number(product.price).toFixed(2)} ${config.currency}</span>
                        </div>
                        <button onclick="confirmAddToCart('${product.id}', '${tableId}')" class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs shadow-lg shadow-amber-500/20 transition-all">
                            ${t('addToCart')}
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
            lucide.createIcons();

            window.currentModalSelectedOptions = [];
            window.toggleOptionSelection = function(idx) {
                const pos = window.currentModalSelectedOptions.indexOf(idx);
                if (pos > -1) {
                    window.currentModalSelectedOptions.splice(pos, 1);
                } else {
                    window.currentModalSelectedOptions.push(idx);
                }
                
                let optionsTotal = 0;
                window.currentModalSelectedOptions.forEach(i => {
                    optionsTotal += Number(product.options[i].price || 0);
                });
                const total = product.price + optionsTotal;
                document.getElementById('modal-calculated-price').innerText = `${total.toFixed(2)} ${config.currency}`;
            };
        }

        function confirmAddToCart(productId, tableId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const selectedIndices = window.currentModalSelectedOptions || [];
            const selectedOptions = selectedIndices.map(i => product.options[i]);

            let extraPrice = 0;
            selectedOptions.forEach(o => extraPrice += Number(o.price || 0));

            const unitPrice = product.price + extraPrice;

            customerCart.push({
                cartItemId: 'cart-' + Date.now(),
                product,
                selectedOptions,
                quantity: 1,
                unitPrice,
                totalPrice: unitPrice
            });

            document.querySelector('.fixed.inset-0').remove();
            showNotification(`Το "${product.name}" προστέθηκε στο καλάθι!`);
            renderCustomerView(document.getElementById('app'), tableId);
        }

        function openCartModal(tableId) {
            const config = getConfig();
            const tables = getTables();
            const lang = getCurrentLang();
            const currentTable = tables.find(tItem => tItem.id === tableId) || { name: 'Τραπέζι' };

            const container = document.getElementById('modal-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4 fade-in';

            const totalCartPrice = customerCart.reduce((sum, item) => sum + item.totalPrice, 0);

            wrapper.innerHTML = `
                <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-w-md w-full p-6 text-slate-800 border border-slate-100 max-h-[90vh] flex flex-col">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">${t('myCart')}</h3>
                            <p class="text-xs text-amber-600 font-semibold">${currentTable.name}</p>
                        </div>
                        <button onclick="this.closest('.fixed').remove()" class="p-2 rounded-xl text-slate-400 hover:bg-slate-100 transition-all">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto space-y-3 my-2 pr-1">
                        ${customerCart.map((item, idx) => {
                            const prodName = lang === 'en' ? (item.product.nameEn || item.product.name) : item.product.name;
                            return `
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200/80 flex items-center justify-between">
                                    <div class="flex-1 min-w-0 pr-3">
                                        <h4 class="font-bold text-slate-900 text-xs truncate">${prodName}</h4>
                                        ${item.selectedOptions.length > 0 ? `
                                            <p class="text-[11px] text-slate-500 truncate">
                                                ${item.selectedOptions.map(o => (lang === 'en' ? (o.nameEn || o.name) : o.name)).join(', ')}
                                            </p>
                                        ` : ''}
                                        <span class="text-xs font-extrabold text-amber-600">${item.totalPrice.toFixed(2)} ${config.currency}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="updateCartItemQty(${idx}, -1, '${tableId}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-700 flex items-center justify-center text-xs font-bold shadow-xs">
                                            -
                                        </button>
                                        <span class="text-xs font-bold text-slate-900 w-4 text-center">${item.quantity}</span>
                                        <button onclick="updateCartItemQty(${idx}, 1, '${tableId}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-700 flex items-center justify-center text-xs font-bold shadow-xs">
                                            +
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="pt-4 border-t border-slate-100 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-500 uppercase">${t('totalAmount')}</span>
                            <span class="text-xl font-extrabold text-amber-600">${totalCartPrice.toFixed(2)} ${config.currency}</span>
                        </div>

                        <!-- Direct Call Button -->
                        <a href="tel:${config.phone}" onclick="handleCallOrder('${currentTable.name}')" class="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 transition-all">
                            <i data-lucide="phone-call" class="w-4 h-4"></i>
                            <span>${t('placeOrderCall').replace('{phone}', config.phone || '')}</span>
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
            lucide.createIcons();
        }

        function updateCartItemQty(idx, change, tableId) {
            if (!customerCart[idx]) return;
            customerCart[idx].quantity += change;
            if (customerCart[idx].quantity <= 0) {
                customerCart.splice(idx, 1);
            } else {
                customerCart[idx].totalPrice = customerCart[idx].unitPrice * customerCart[idx].quantity;
            }

            document.querySelector('.fixed.inset-0')?.remove();
            if (customerCart.length > 0) {
                openCartModal(tableId);
            }
            renderCustomerView(document.getElementById('app'), tableId);
        }

        function handleCallOrder(tableName) {
            showNotification(`Γίνεται κλήση στο κατάστημα για το ${tableName}!`);
        }

        window.onload = function() {
            renderApp();
            startCloudSync();
        };

        window.onpopstate = function() {
            renderApp();
        };
    </script>
</body>
</html>
